name: Official host acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installed:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: limecloud/hetu
          ref: f5f18d4abf84bc1d786e083b8c916c559cec6a5c
          path: host
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wordflowlab/hetu-reader-review
          ref: 699da77021262bdc1bb6cd5eb211dbcc3b9cab6a
          path: hetu-reader-review
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wordflowlab/hetu-comic-studio
          ref: 67aae15f226e5d8796954bcc231f0972276a2a49
          path: hetu-comic-studio
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wordflowlab/hetu-audio-drama
          ref: d1e61be0c501ea58d6406dea499a2120f5819b7d
          path: hetu-audio-drama
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '25.0.0'
      - name: Install test dependencies without compiling host
        run: |
          (cd host && npm ci)
          (cd plugin && npm ci)
      - name: Install browser for offline artifacts
        working-directory: plugin
        run: npx playwright install chromium
      - name: Build fixed plugin only
        working-directory: plugin
        run: |
          npm run build
          npm run check
          npm run test:unit
          npm run package
      - name: Verify exact peer source and packages
        working-directory: plugin
        run: python3 scripts/verify-peers.py
      - name: Verify signed host and exact plugin package
        working-directory: plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/accept-installed.py
      - name: Retain actual work surfaces and acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-installed-acceptance
          path: |
            plugin/output/installed-acceptance/*.json
            plugin/output/installed-acceptance/*.html
            plugin/output/installed-acceptance/*.epub
            plugin/output/installed-acceptance/*.pdf
            plugin/output/installed-acceptance/*.png
            plugin/output/installed-acceptance/*.wav
            plugin/output/installed-acceptance/*.log
            plugin/test-results/
          if-no-files-found: ignore
          retention-days: 30
